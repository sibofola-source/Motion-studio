<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Framework Explainer</title>
<style>
@font-face { font-family: 'Cormorant'; font-weight: 500; src: url(../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-normal.woff2); }
@font-face { font-family: 'Cormorant'; font-weight: 600; src: url(../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-600-normal.woff2); }
@font-face { font-family: 'Cormorant'; font-weight: 500; font-style: italic; src: url(../node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff2); }
@font-face { font-family: 'Inter'; font-weight: 400; src: url(../node_modules/@fontsource/inter/files/inter-latin-400-normal.woff2); }
@font-face { font-family: 'Inter'; font-weight: 500; src: url(../node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); }

:root { --bg: #0A0E14; --accent: #3EE0A8; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: #e8ecf1; font-family: 'Inter', sans-serif; }
.abs { position: absolute; }
.center { left: 0; right: 0; text-align: center; }

#glow { left: 50%; top: 50%; width: 1800px; height: 1300px; margin: -650px 0 0 -900px; border-radius: 50%;
  background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 55%, transparent), color-mix(in srgb, var(--accent) 14%, transparent) 45%, transparent 100%); }
#vignette { inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.55) 100%); }
#grain { inset: 0; opacity: .07; mix-blend-mode: overlay; }

.hline { left: 0; width: 1920px; height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(214,220,228,.15) 12%, rgba(236,240,245,.75) 50%, rgba(214,220,228,.15) 88%, transparent 100%); }

.chrome { background-image:
    linear-gradient(100deg, transparent 0%, transparent 42%, rgba(255,255,255,.95) 50%, transparent 58%, transparent 100%),
    linear-gradient(180deg, #ffffff 0%, #e9edf2 28%, #9aa3af 47%, #f7f9fb 54%, #c3c9d2 72%, #7a838f 100%);
  background-size: 300% 100%, 100% 100%; background-repeat: no-repeat;
  -webkit-background-clip: text; background-clip: text; color: transparent; }

.label { font-family: 'Inter'; font-weight: 500; font-size: 22px; letter-spacing: .42em; text-transform: uppercase; color: #aeb7c2; }
#t-label { top: 330px; }
#t-name { top: 378px; font-family: 'Cormorant'; font-weight: 600; font-size: 168px; line-height: 1.05; letter-spacing: .01em; }
#t-line { top: 600px; left: 50%; width: 560px; margin-left: -280px; height: 2px; border-radius: 2px; background: var(--accent);
  box-shadow: 0 0 12px var(--accent), 0 0 32px var(--accent), 0 0 64px color-mix(in srgb, var(--accent) 60%, transparent); }
#t-promise { top: 642px; font-size: 36px; font-weight: 400; color: #c9d0d8; letter-spacing: .005em; }

#r-head { top: 212px; }
#row { top: 290px; left: 0; width: 1920px; height: 520px; }
.col { position: absolute; top: 0; text-align: center; }
.box { position: relative; margin: 0 auto; width: 196px; height: 196px; border-radius: 22px;
  border: 1.5px solid rgba(205,213,222,.22); background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.01)); }
.box span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant'; font-weight: 600; font-size: 132px; line-height: 1; padding-bottom: 8px; }
.dim { color: rgba(170,180,194,.26); }
.lit { color: var(--accent); text-shadow: 0 0 18px var(--accent), 0 0 44px var(--accent), 0 0 90px color-mix(in srgb, var(--accent) 70%, transparent); }
.word { margin-top: 34px; font-family: 'Cormorant'; font-weight: 600; font-size: 52px; line-height: 1.1; color: #eef1f5; }
.meaning { margin: 12px auto 0; max-width: 330px; font-size: 23px; line-height: 1.42; color: #9ea8b4; }

#sweep { top: 770px; height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--accent) 12%, var(--accent));
  box-shadow: 0 0 12px var(--accent), 0 0 30px var(--accent); }
#sweep-head { top: 763px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 14px #fff, 0 0 30px var(--accent), 0 0 70px var(--accent); }
#closing { top: 806px; font-family: 'Cormorant'; font-style: italic; font-weight: 500; font-size: 64px; color: #f1f4f7; }

#e-name { top: 352px; font-family: 'Cormorant'; font-weight: 600; font-size: 140px; line-height: 1.05; }
#e-line { top: 540px; left: 50%; width: 140px; margin-left: -70px; height: 2px; background: var(--accent); box-shadow: 0 0 14px var(--accent), 0 0 34px var(--accent); }
#e-title { top: 576px; font-size: 26px; letter-spacing: .38em; text-transform: uppercase; color: #c3cad3; font-weight: 500; }
#e-handle { top: 632px; font-size: 32px; color: var(--accent); font-weight: 500; text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 55%, transparent); }
#e-tag { top: 700px; font-family: 'Cormorant'; font-style: italic; font-weight: 500; font-size: 46px; color: #e3e8ee; }

#prog-track { left: 0; bottom: 0; width: 1920px; height: 4px; background: rgba(255,255,255,.07); }
#prog { left: 0; bottom: 0; height: 4px; background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 40%, #c9d0d8), var(--accent));
  box-shadow: 0 0 10px var(--accent), 0 0 22px color-mix(in srgb, var(--accent) 60%, transparent); }
</style>
</head>
<body>
<div id="stage">
  <div id="glow" class="abs"></div>
  <div id="vignette" class="abs"></div>
  <div id="line1" class="abs hline" style="top:156px"></div>
  <div id="line2" class="abs hline" style="top:924px"></div>

  <div id="t-label" class="abs center label"></div>
  <div id="t-name" class="abs center"><span class="chrome" id="t-name-txt"></span></div>
  <div id="t-line" class="abs"></div>
  <div id="t-promise" class="abs center"></div>

  <div id="r-head" class="abs center label"></div>
  <div id="row" class="abs"></div>
  <div id="sweep" class="abs"></div>
  <div id="sweep-head" class="abs"></div>
  <div id="closing" class="abs center"></div>

  <div id="e-name" class="abs center"><span class="chrome" id="e-name-txt"></span></div>
  <div id="e-line" class="abs"></div>
  <div id="e-title" class="abs center"></div>
  <div id="e-handle" class="abs center"></div>
  <div id="e-tag" class="abs center"></div>

  <svg id="grain" class="abs" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div id="prog-track" class="abs"></div>
  <div id="prog" class="abs"></div>
</div>

<script>
// Everything on screen is a pure function of time t (seconds): window.renderAt(t).
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }; // in-out cubic
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const prog = (t, start, dur) => clamp((t - start) / dur);

// soft-to-sharp blur-in (and optional blur-out)
function blurIn(el, t, start, dur = 1.15, out = null, outDur = .7, rise = 18, extra = '') {
  let p = ease(prog(t, start, dur));
  if (out !== null) p *= 1 - ease(prog(t, out, outDur));
  el.style.opacity = p;
  el.style.filter = `blur(${(1 - p) * 16}px)${extra}`;
  el.style.transform = `translateY(${(1 - p) * rise}px)`;
  el.style.visibility = p < .002 ? 'hidden' : 'visible';
  return p;
}

function setup(cfg, tl) {
  window.CFG = cfg; window.TL = tl;
  document.documentElement.style.setProperty('--bg', cfg.colors.background);
  document.documentElement.style.setProperty('--accent', cfg.colors.accent);
  $('t-label').textContent = cfg.label;
  $('t-name-txt').textContent = cfg.name;
  $('t-promise').textContent = cfg.promise;
  $('r-head').textContent = cfg.name;
  $('closing').textContent = cfg.closing;
  $('e-name-txt').textContent = cfg.endCard.name;
  $('e-title').textContent = cfg.endCard.title;
  $('e-handle').textContent = cfg.endCard.handle;
  $('e-tag').textContent = cfg.endCard.tagline;

  const n = cfg.letters.length, gap = 40;
  const colW = Math.min(390, (1700 - gap * (n - 1)) / n);
  const total = colW * n + gap * (n - 1), x0 = (1920 - total) / 2;
  window.ROW = { x0, total, colW, gap };
  const row = $('row');
  cfg.letters.forEach((l, i) => {
    const c = document.createElement('div');
    c.className = 'col'; c.style.left = (x0 + i * (colW + gap)) + 'px'; c.style.width = colW + 'px';
    c.innerHTML = `<div class="box"><span class="dim">${l.letter}</span><span class="lit">${l.letter}</span><span class="chrome silver">${l.letter}</span></div>
      <div class="word">${l.word}</div><div class="meaning">${l.meaning}</div>`;
    row.appendChild(c);
  });
}

function renderAt(t) {
  const tl = TL, cfg = CFG, T = tl.duration, acc = cfg.colors.accent;

  // background: slow breathing glow that warms when a letter lights
  let lift = 0;
  tl.letters.forEach((s, i) => { lift = Math.max(lift, Math.exp(-Math.max(0, t - s) * 1.6) * (t >= s ? 1 : 0)); });
  lift = Math.max(lift, (t >= tl.closing ? Math.exp(-(t - tl.closing) * 1.2) : 0) * 1.3);
  const g = $('glow');
  g.style.opacity = (0.28 + 0.05 * Math.sin(t * 0.7) + 0.12 * lift) * ease(prog(t, 0, 2.2));
  g.style.transform = `translate(${Math.sin(t * .23) * 70}px, ${Math.cos(t * .19) * 40 + 30}px) scale(${1 + .04 * Math.sin(t * .4)})`;

  // two thin silver lines draw out from the centre, then drift very slightly
  const lp = ease(prog(t, 0.05, 1.8));
  $('line1').style.transform = `scaleX(${lp}) translateX(${Math.sin(t * .3) * 6}px)`;
  $('line2').style.transform = `scaleX(${lp}) translateX(${-Math.sin(t * .3) * 6}px)`;
  $('line1').style.opacity = $('line2').style.opacity = .85 * lp * (1 - .4 * ease(prog(t, tl.endCard - .4, 1)));

  // --- title ---
  const out = tl.titleOut;
  blurIn($('t-label'), t, tl.label, 1.1, out, .7);
  blurIn($('t-name'), t, tl.name, 1.4, out, .75, 26);
  $('t-name-txt').style.backgroundPosition = `${130 - 160 * ease(prog(t, tl.name + .5, 2.4))}% 0, 0 0`;
  const ul = ease(prog(t, tl.underline, 1.2)) * (1 - ease(prog(t, out, .6)));
  $('t-line').style.transform = `scaleX(${ul})`; $('t-line').style.opacity = ul;
  blurIn($('t-promise'), t, tl.promise, 1.2, out, .7);

  // --- letter row ---
  const rowOut = tl.endCard - .6;
  blurIn($('r-head'), t, tl.rowIn - .1, 1.0, rowOut, .8, 10);
  const cols = document.querySelectorAll('#row .col');
  cols.forEach((c, i) => {
    const box = c.children[0], [dim, lit, silver] = box.children;
    const word = c.children[1], meaning = c.children[2];
    const on = tl.letters[i], off = tl.letterOff[i];
    blurIn(box, t, tl.rowIn + i * .12, 1.1, rowOut, .8, 22);
    const a = ease(prog(t, on - .05, .45)) * (1 - ease(prog(t, off, .7)));    // lit amount
    const s = ease(prog(t, off, .7));                                          // silver amount
    dim.style.opacity = 1 - Math.max(a, s);
    lit.style.opacity = a;
    silver.style.opacity = s;
    silver.style.backgroundPosition = `${140 - 180 * ease(prog(t, off, 1.6))}% 0, 0 0`;
    // the sweep head passing under a box gives it a brief glint
    const cx = ROW.x0 + i * (ROW.colW + ROW.gap) + ROW.colW / 2;
    const headX = ROW.x0 - 40 + (ROW.total + 80) * ease(prog(t, tl.sweep, 1.3));
    const glint = t > tl.sweep ? Math.exp(-Math.pow((headX - cx) / 120, 2)) : 0;
    const bw = Math.max(a, glint * .8);
    box.style.borderColor = `color-mix(in srgb, ${acc} ${Math.round(bw * 100)}%, rgba(205,213,222,${.22 + .3 * s}))`;
    box.style.boxShadow = `0 0 ${40 * bw}px color-mix(in srgb, ${acc} ${Math.round(bw * 55)}%, transparent), inset 0 0 ${30 * bw}px color-mix(in srgb, ${acc} ${Math.round(bw * 25)}%, transparent)`;
    box.style.transform += ` scale(${1 + .045 * a})`;
    blurIn(word, t, on + .05, 1.0, rowOut, .8, 16);
    blurIn(meaning, t, on + .3, 1.1, rowOut, .8, 14);
  });

  // --- sweep + closing ---
  const sp = ease(prog(t, tl.sweep, 1.3));
  const sOut = 1 - ease(prog(t, rowOut, .8));
  const sw = $('sweep');
  sw.style.left = (ROW.x0 - 40) + 'px'; sw.style.width = ((ROW.total + 80) * sp) + 'px'; sw.style.opacity = (sp > 0 ? 1 : 0) * sOut;
  const head = $('sweep-head');
  head.style.left = (ROW.x0 - 40 + (ROW.total + 80) * sp) + 'px';
  head.style.opacity = (sp > 0 ? 1 : 0) * (1 - ease(prog(t, tl.sweep + 1.1, .6)));
  blurIn($('closing'), t, tl.closing, 1.0, rowOut, .8, 20);

  // --- end card ---
  const e = tl.endCard;
  blurIn($('e-name'), t, e, 1.2, null, .7, 24);
  $('e-name-txt').style.backgroundPosition = `${130 - 160 * ease(prog(t, e + .4, 2.0))}% 0, 0 0`;
  const el = ease(prog(t, e + .45, .9));
  $('e-line').style.transform = `scaleX(${el})`; $('e-line').style.opacity = el;
  blurIn($('e-title'), t, e + .55, 1.0);
  blurIn($('e-handle'), t, e + .7, 1.0);
  blurIn($('e-tag'), t, e + .85, 1.0);

  // grain shifts each frame so it reads as film, not a pattern
  $('grain').style.transform = `translate(${(Math.floor(t * 30) * 37) % 60 - 30}px, ${(Math.floor(t * 30) * 53) % 60 - 30}px)`;
  $('grain').style.left = '-30px'; $('grain').style.top = '-30px';
  $('grain').setAttribute('width', 1980); $('grain').setAttribute('height', 1140);

  // progress bar runs the whole time
  $('prog').style.width = (1920 * clamp(t / T)) + 'px';

  // final fade to black over the last half second
  $('stage').style.opacity = 1 - ease(prog(t, T - .4, .4));
}
window.setup = setup; window.renderAt = renderAt;
</script>
</body>
</html>
